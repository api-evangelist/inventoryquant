aid: inventoryquant
name: InventoryQuant
description: >-
  InventoryQuant automates inventory and contents documentation for the insurance
  claims industry. Public adjusters, restoration firms, and insurance claim handlers
  record video or audio walkthroughs of a loss, and the platform transcribes each
  spoken line item, detects and describes the contents, matches replacement pricing
  from major retailers, and generates a submission-ready report in XactContents or
  PDF format. It supports smart glasses, photos, multiple speakers, self-corrections,
  background noise, and 100+ languages, turning days of manual contents-claim work
  into minutes. Founded in the Y Combinator Winter 2026 batch by Sander Schulhoff.
